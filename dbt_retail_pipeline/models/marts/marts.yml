version: 2

models:
  - name: dim_products_sales
    description: "Product sales dimensional mart ranking revenue and volume performance"
    columns:
      - name: product_name
        description: "Primary key: product name"
        tests:
          - unique
          - not_null
      - name: total_revenue
        description: "Aggregate gross revenue for product"
        tests:
          - not_null
      - name: revenue_rank
        description: "Descending revenue ranking"
        tests:
          - not_null

  - name: dim_regional_performance
    description: "Regional sales dimensional mart ranking sales volume and customer metrics"
    columns:
      - name: region
        description: "Primary key: sales region"
        tests:
          - unique
          - not_null
      - name: total_revenue
        description: "Total revenue generated by the region"
        tests:
          - not_null

  - name: fct_sales_monthly
    description: "Monthly sales fact table measuring trends and month-over-month growth"
    columns:
      - name: sales_month
        description: "Primary key: formatted Year-Month (YYYY-MM)"
        tests:
          - unique
          - not_null
      - name: total_revenue
        description: "Total revenue for the calendar month"
        tests:
          - not_null
